name: StackBlitz

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# The comment is the only thing this workflow writes.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: stackblitz-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target, so this is the base branch on purpose: the
      # script needs a write token and must never run a contributor's
      # code. Nothing from the head is checked out or executed.
      - name: Checkout the base branch
        uses: actions/checkout@v7

      - name: Link the examples
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/stackblitz-comment.sh
